# TLS is tunneled end to end. Squid authorizes only the reviewed destination;
# it does not decrypt Robinhood traffic.
http_port 127.0.0.1:3128
cache_effective_user egressproxy
cache_effective_group egressproxy

acl CONNECT method CONNECT
acl TLS_port port 443
acl numeric_target url_regex -i ^([0-9]{1,3}\.){3}[0-9]{1,3}:443$
acl numeric_target url_regex -i ^\[[0-9a-f:]+\]:443$
acl reviewed_robinhood dstdomain "/etc/squid/robinhood-endpoints.allow"

http_access deny !CONNECT
http_access deny !TLS_port
http_access deny numeric_target
http_access allow reviewed_robinhood
http_access deny all

# Resolve in the trusted proxy process. The trader UID cannot issue DNS itself.
dns_nameservers 127.0.0.11
pinger_enable off
shutdown_lifetime 1 seconds

cache deny all
access_log stdio:/var/log/squid/access.log
cache_log /var/log/squid/cache.log
cache_store_log none
pid_filename /run/squid/squid.pid
coredump_dir /tmp
visible_hostname rsa-robinhood-egress
forwarded_for delete
via off
