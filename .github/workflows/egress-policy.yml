name: Robinhood Egress Policy

on:
  push:
    branches:
      - main
      - 'develop*'
  pull_request:
    branches:
      - main
      - 'develop*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Run unit and static policy tests
        run: uv run python -m unittest discover -s tests -p 'test_*.py'
      - name: Build local qualification images
        run: |
          docker build --tag auto-rsa:egress-test .
          docker build --tag rsa-robinhood-egress:egress-test deploy/egress
      - name: Run synthetic offline egress probes
        env:
          RSA_TEST_APP_IMAGE: auto-rsa:egress-test
          RSA_TEST_EGRESS_IMAGE: rsa-robinhood-egress:egress-test
        run: tests/egress/run.sh
