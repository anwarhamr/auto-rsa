table inet rsa_egress {
    set blocked_ipv4 {
        type ipv4_addr
        flags interval
        elements = { 0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16, 198.18.0.0/15, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 240.0.0.0/4 }
    }

    chain input {
        type filter hook input priority filter; policy drop;
        ct state invalid drop
        ct state established,related accept
        iifname "lo" tcp dport 3128 accept
    }

    chain output {
        type filter hook output priority filter; policy drop;
        ct state invalid drop
        ct state established,related accept
        meta skuid 10001 ip daddr 127.0.0.1 tcp dport 3128 accept
        meta skuid 10002 meta nfproto ipv4 udp dport 53 accept
        meta skuid 10002 meta nfproto ipv4 tcp dport 53 accept

        # Test-only fixture exception. Production has no such rule.
        meta skuid 10002 meta nfproto ipv4 ip daddr 198.18.0.10 tcp dport 443 accept
        meta skuid 10002 ip daddr @blocked_ipv4 drop
        meta skuid 10002 meta nfproto ipv4 tcp dport 443 accept
    }
}
